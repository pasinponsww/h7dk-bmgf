[package]
name = "bsp"
version.workspace = true
edition.workspace = true
description = "Board Support Package"
[dependencies]
stm32h7xx-hal = { version = "0.16", features = ["stm32h735", "rt", "ltdc", "defmt", "xspi", "rtc"] }
chrono = { version = "0.4", default-features = false }
embedded-display-controller = "0.2"
cortex-m = "0.7"
defmt = "0.3"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
