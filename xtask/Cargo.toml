[package]
name = "xtask"
version.workspace = true
edition.workspace = true
description = "Project helper: `cargo proj <group> <command>` (common: status, test, check ...; mbedded: build, flash, run ...)."
publish = false

[[bin]]
name = "proj"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }

[lints]
workspace = true