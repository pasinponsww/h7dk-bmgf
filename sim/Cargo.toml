[package]
name = "sim"
version.workspace = true
edition.workspace = true
description = "Browser simulator: the real app and content logic compiled to WebAssembly."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
app = { path = ".." }

[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
